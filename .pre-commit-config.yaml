# Tool versions here are kept in lockstep with the `dev` extra in pyproject.toml.
# When you bump one, bump the other, or local hooks and CI will disagree.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # `ruff` is a legacy alias; `ruff-check` is the current hook id.
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        # Run against the whole project using the config in pyproject.toml
        # rather than the staged-file list, so results match `mypy` in CI.
        pass_filenames: false
        args: []
        # Pinned to match the `dev` extra in pyproject.toml, so the hook and
        # CI type-check against identical stubs.
        additional_dependencies:
          - numpy==2.5.3
          - pandas-stubs==2.3.3.260113
          - types-PyYAML==6.0.12.20250915
