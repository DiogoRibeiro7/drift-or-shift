name: Feature or experiment request
description: Suggest a new capability, dataset, or drift scenario.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What question about label shift or drift would this let you answer?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New experiment
        - New dataset
        - Drift variant or generator
        - Calibration
        - Reporting / dashboards
        - Tooling or CI
        - Other
    validations:
      required: true
