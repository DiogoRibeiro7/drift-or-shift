name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Black (format)
        run: black --check --diff .

      - name: Mypy (types)
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Quote every version: unquoted 3.10 is the YAML float 3.1, which is
        # what silently pinned this matrix to a non-existent interpreter.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Verify the interpreter actually matches the matrix
        shell: bash
        run: |
          python -c "import sys; print(sys.version)"
          python - <<'PY'
          import sys
          want = "${{ matrix.python-version }}"
          got = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert got == want, f"matrix asked for {want}, runner gave {got}"
          PY

      - name: Pytest
        run: >
          pytest
          --cov=drift_or_shift
          --cov=caliblab
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          # `warn`, not `error`: when pytest fails there is no htmlcov, and a
          # hard failure here adds a second red step that hides the real one.
          if-no-files-found: warn

  build:
    name: Build & install distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install dist/*.whl

      - name: Smoke-test the installed distribution
        run: |
          /tmp/fresh/bin/python -c "
          import drift_or_shift, drift_shift_pipeline, caliblab
          import drift_or_shift.experiments.exp1_label_shift_synth as exp1
          assert callable(exp1.main)
          print('installed OK:', drift_or_shift.__version__)
          "
          /tmp/fresh/bin/dos-exp1 --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
