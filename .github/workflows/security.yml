name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly disclosed advisories surface without waiting for a push.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install -e ".[dev]"

      - name: Audit installed dependencies for known advisories
        run: |
          python -m pip install pip-audit
          # --skip-editable leaves out this project itself, which is not on
          # PyPI and so can never be audited. Not --strict: with an editable
          # install present it fails on that alone. Real advisories still exit
          # non-zero without it.
          python -m pip_audit --skip-editable --progress-spinner off

  zizmor:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit the GitHub Actions workflows themselves
        run: |
          python -m pip install zizmor
          # zizmor ships a binary, not an importable module.
          zizmor --config .github/zizmor.yml --format sarif .github/workflows > zizmor.sarif

      - name: Upload the report
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail if the audit reported findings
        # zizmor exits 0 when asked for SARIF output even when it found
        # problems, so gate on the report's contents rather than its status.
        run: python tools/check_sarif.py zizmor.sarif
