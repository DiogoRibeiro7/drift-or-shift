version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # pandas-stubs 3.x requires Python >= 3.11. This project supports 3.10,
      # so the dev extra cannot install it and the py3.10 CI job fails at the
      # install step. Drop this entry when requires-python moves past 3.10.
      - dependency-name: pandas-stubs
        versions: [">=3.0"]
    groups:
      dev-tooling:
        patterns: ["ruff", "black", "mypy", "pytest*", "pre-commit", "build", "*-stubs", "types-*"]
      scientific-stack:
        patterns: ["numpy", "pandas", "scikit-learn", "matplotlib", "pyyaml"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

  # Without this, Dependabot bumps a tool in pyproject.toml's dev extra and
  # leaves .pre-commit-config.yaml behind, so the hooks and CI quietly stop
  # checking the same versions. tests/test_tooling_pins.py catches the drift;
  # this is what stops it happening.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    ignore:
      # Same constraint as the pip ecosystem above: pandas-stubs 3.x requires
      # Python >= 3.11 and this project supports 3.10. The mypy hook's stubs
      # must match the dev extra, so both ecosystems need the ignore.
      - dependency-name: pandas-stubs
        versions: [">=3.0"]
    groups:
      pre-commit-hooks:
        patterns: ["*"]
